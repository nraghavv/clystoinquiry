<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Admin — Clysto Inquiries</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../supabase-config.js"></script>
<style>
  :root{
    --ink:#14181A; --ink-soft:#5B6662; --ink-faint:#8A9490;
    --bg:#F9F8F3; --primary:#00917D; --primary-dark:#007A68;
    --primary-wash:rgba(0,145,125,0.06); --border:rgba(20,24,26,0.08);
    --card:#ffffff; --danger:#ef4444; --danger-wash:rgba(239,68,68,0.08);
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;line-height:1.5;}
  a{color:inherit;}
  button{font-family:inherit;}

  /* ---------- Login ---------- */
  #loginScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
  .login-card{width:100%;max-width:380px;background:var(--card);border:1px solid var(--border);border-radius:20px;padding:36px 32px;box-shadow:0 20px 50px rgba(0,0,0,0.06);}
  .login-card h1{font-size:1.3rem;font-weight:600;margin:0 0 4px;letter-spacing:-0.01em;}
  .login-card p{font-size:13px;color:var(--ink-faint);margin:0 0 26px;}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:13px;font-weight:500;margin-bottom:7px;}
  .field input{width:100%;font-size:14px;color:var(--ink);background:rgba(0,0,0,0.02);border:1px solid var(--border);border-radius:12px;padding:12px 14px;outline:none;transition:border-color .2s,box-shadow .2s,background .2s;}
  .field input:focus{border-color:var(--primary);background:#fff;box-shadow:0 0 0 3px rgba(0,145,125,0.15);}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--primary);color:#fff;border:none;cursor:pointer;font-size:14px;font-weight:500;padding:12px 22px;border-radius:999px;box-shadow:0 8px 20px rgba(0,145,125,0.2);transition:background .2s,transform .15s;}
  .btn:hover{background:var(--primary-dark);}
  .btn:active{transform:scale(0.98);}
  .btn:disabled{opacity:.6;cursor:not-allowed;}
  .btn-block{width:100%;}
  .btn-ghost{background:transparent;color:var(--ink-soft);border:1px solid var(--border);box-shadow:none;}
  .btn-ghost:hover{background:rgba(0,0,0,0.03);}
  .btn-danger{background:var(--danger);box-shadow:none;}
  .btn-danger:hover{background:#dc2626;}
  .login-err{font-size:12px;color:var(--danger);margin-top:14px;display:none;}

  /* ---------- App shell ---------- */
  #app{display:none;min-height:100vh;}
  .shell{display:flex;min-height:100vh;}
  .sidebar{width:230px;flex-shrink:0;background:#fff;border-right:1px solid var(--border);padding:24px 16px;display:flex;flex-direction:column;}
  .brand{font-size:15px;font-weight:700;letter-spacing:-0.01em;padding:0 10px 26px;}
  .brand span{color:var(--primary);}
  .nav-item{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:11px 12px;border-radius:10px;font-size:13.5px;font-weight:500;color:var(--ink-soft);cursor:pointer;transition:background .15s,color .15s;margin-bottom:2px;}
  .nav-item:hover{background:rgba(0,0,0,0.03);}
  .nav-item.active{background:var(--primary-wash);color:var(--primary-dark);}
  .nav-count{font-size:11px;color:var(--ink-faint);background:rgba(0,0,0,0.04);border-radius:999px;padding:2px 8px;}
  .nav-item.active .nav-count{color:var(--primary-dark);background:rgba(0,145,125,0.12);}
  .sidebar-footer{margin-top:auto;padding-top:16px;border-top:1px solid var(--border);}
  .user-email{font-size:11.5px;color:var(--ink-faint);padding:0 12px 10px;word-break:break-all;}
  .logout-btn{display:flex;align-items:center;gap:8px;width:100%;background:none;border:none;color:var(--ink-soft);font-size:13px;font-weight:500;padding:10px 12px;border-radius:10px;cursor:pointer;transition:background .15s;}
  .logout-btn:hover{background:rgba(0,0,0,0.03);}

  .main{flex:1;min-width:0;padding:28px 32px 60px;}
  .topbar{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:22px;flex-wrap:wrap;gap:12px;}
  .topbar h1{font-size:1.35rem;font-weight:600;letter-spacing:-0.01em;margin:0;}
  .topbar p{font-size:13px;color:var(--ink-faint);margin:4px 0 0;}

  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:28px;}
  .stat-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px 20px;}
  .stat-card .num{font-size:1.6rem;font-weight:600;letter-spacing:-0.02em;}
  .stat-card .label{font-size:12.5px;color:var(--ink-faint);margin-top:2px;}

  .toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px;}
  .search-wrap{position:relative;flex:1;min-width:200px;max-width:320px;}
  .search-wrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--ink-faint);}
  .search-wrap input{width:100%;font-size:13.5px;padding:10px 12px 10px 34px;border:1px solid var(--border);border-radius:999px;background:#fff;outline:none;transition:border-color .2s,box-shadow .2s;}
  .search-wrap input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(0,145,125,0.12);}
  select.filter-select{font-size:13px;padding:10px 14px;border:1px solid var(--border);border-radius:999px;background:#fff;color:var(--ink-soft);outline:none;cursor:pointer;}

  .table-card{background:var(--card);border:1px solid var(--border);border-radius:16px;overflow:hidden;}
  .row{display:grid;grid-template-columns:1.4fr 1.2fr 1.4fr 100px 90px 70px;gap:12px;align-items:center;padding:15px 20px;border-bottom:1px solid var(--border);font-size:13.5px;}
  .row:last-child{border-bottom:none;}
  .row.head{background:rgba(0,0,0,0.015);font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-faint);font-weight:600;padding:12px 20px;}
  .row.clickable{cursor:pointer;transition:background .15s;}
  .row.clickable:hover{background:var(--primary-wash);}
  .cell-name{font-weight:600;}
  .cell-sub{color:var(--ink-faint);font-size:12px;margin-top:2px;}
  .badge{display:inline-block;font-size:11px;font-weight:600;padding:4px 10px;border-radius:999px;}
  .badge.New{background:var(--primary-wash);color:var(--primary-dark);}
  .badge.Read{background:rgba(0,0,0,0.05);color:var(--ink-soft);}
  .badge.Archived{background:rgba(0,0,0,0.035);color:var(--ink-faint);}
  .view-link{color:var(--primary);font-weight:600;font-size:12.5px;white-space:nowrap;}

  .empty-state,.loading-state{padding:60px 20px;text-align:center;color:var(--ink-faint);font-size:13.5px;}
  .spinner{width:18px;height:18px;border-radius:50%;border:2px solid rgba(0,145,125,0.2);border-top-color:var(--primary);animation:spin .7s linear infinite;margin:0 auto 12px;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .pagination{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;font-size:12.5px;color:var(--ink-faint);}
  .pagination .btns{display:flex;gap:8px;}
  .page-btn{border:1px solid var(--border);background:#fff;border-radius:8px;padding:6px 12px;cursor:pointer;font-size:12.5px;color:var(--ink-soft);}
  .page-btn:hover:not(:disabled){border-color:rgba(0,145,125,0.4);color:var(--primary-dark);}
  .page-btn:disabled{opacity:.4;cursor:not-allowed;}

  /* ---------- Drawer ---------- */
  #overlay{position:fixed;inset:0;background:rgba(20,24,26,0.35);display:none;z-index:40;}
  #drawer{position:fixed;top:0;right:0;height:100vh;width:420px;max-width:92vw;background:#fff;z-index:50;box-shadow:-16px 0 40px rgba(0,0,0,0.12);transform:translateX(100%);transition:transform .25s ease;display:flex;flex-direction:column;}
  #drawer.open{transform:translateX(0);}
  #overlay.open{display:block;}
  .drawer-head{display:flex;align-items:center;justify-content:space-between;padding:20px 22px;border-bottom:1px solid var(--border);}
  .drawer-head h2{font-size:1.05rem;font-weight:600;margin:0;letter-spacing:-0.01em;}
  .drawer-close{background:none;border:none;cursor:pointer;color:var(--ink-soft);padding:6px;border-radius:8px;}
  .drawer-close:hover{background:rgba(0,0,0,0.04);}
  .drawer-body{flex:1;overflow-y:auto;padding:22px;}
  .dfield{margin-bottom:18px;}
  .dfield .dlabel{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-faint);font-weight:600;margin-bottom:5px;}
  .dfield .dval{font-size:14px;color:var(--ink);white-space:pre-wrap;word-break:break-word;}
  .dfield .dval.empty{color:var(--ink-faint);font-style:italic;}
  .drawer-foot{padding:16px 22px;border-top:1px solid var(--border);display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  .status-select{font-size:13px;padding:9px 12px;border:1px solid var(--border);border-radius:10px;background:#fff;cursor:pointer;}

  @media(max-width:860px){
    .sidebar{position:fixed;left:0;top:0;bottom:0;transform:translateX(-100%);transition:transform .2s;z-index:60;}
    .sidebar.open{transform:translateX(0);}
    .main{padding:20px 16px 60px;}
    .row{grid-template-columns:1fr 90px;}
    .row .hide-mobile{display:none;}
  }
</style>
</head>
<body>

<!-- ===================== LOGIN ===================== -->
<div id="loginScreen">
  <div class="login-card">
    <h1>Clysto Admin</h1>
    <p>Sign in to manage inquiries.</p>
    <form id="loginForm" novalidate>
      <div class="field">
        <label>Email</label>
        <input type="email" id="loginEmail" autocomplete="username" required>
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="loginPassword" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn-block" id="loginBtn">Sign In</button>
      <p class="login-err" id="loginErr"></p>
    </form>
  </div>
</div>

<!-- ===================== APP ===================== -->
<div id="app">
  <div class="shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">Clysto <span>Admin</span></div>
      <nav id="navList">
        <div class="nav-item active" data-view="dashboard">
          <span>Dashboard</span>
        </div>
        <div class="nav-item" data-view="grow">
          <span>Grow With Us</span><span class="nav-count" id="count-grow">–</span>
        </div>
        <div class="nav-item" data-view="partnership">
          <span>Partnerships</span><span class="nav-count" id="count-partnership">–</span>
        </div>
        <div class="nav-item" data-view="general">
          <span>General</span><span class="nav-count" id="count-general">–</span>
        </div>
      </nav>
      <div class="sidebar-footer">
        <div class="user-email" id="userEmail"></div>
        <button class="logout-btn" id="logoutBtn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg>
          Sign Out
        </button>
      </div>
    </aside>

    <main class="main">
      <!-- Dashboard home -->
      <div id="view-dashboard">
        <div class="topbar">
          <div>
            <h1>Dashboard</h1>
            <p>Overview of all inquiry activity.</p>
          </div>
        </div>
        <div class="cards" id="statCards"></div>
        <h2 style="font-size:14px;font-weight:600;margin:0 0 12px;">Latest Submissions</h2>
        <div class="table-card" id="latestTableWrap"></div>
      </div>

      <!-- Category list view -->
      <div id="view-list" style="display:none;">
        <div class="topbar">
          <div>
            <h1 id="listTitle">Grow With Us</h1>
            <p id="listSub">All submissions in this category.</p>
          </div>
        </div>
        <div class="toolbar">
          <div class="search-wrap">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
            <input type="text" id="searchInput" placeholder="Search name, email, or company…">
          </div>
          <select class="filter-select" id="statusFilter">
            <option value="all">All Statuses</option>
            <option value="New">New</option>
            <option value="Read">Read</option>
            <option value="Archived">Archived</option>
          </select>
        </div>
        <div class="table-card" id="listTableWrap"></div>
      </div>
    </main>
  </div>
</div>

<!-- Drawer -->
<div id="overlay"></div>
<div id="drawer">
  <div class="drawer-head">
    <h2 id="drawerTitle">Inquiry Details</h2>
    <button class="drawer-close" id="drawerClose">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
    </button>
  </div>
  <div class="drawer-body" id="drawerBody"></div>
  <div class="drawer-foot">
    <select class="status-select" id="statusSelect">
      <option value="New">New</option>
      <option value="Read">Read</option>
      <option value="Archived">Archived</option>
    </select>
    <button class="btn btn-danger" id="deleteBtn">Delete</button>
  </div>
</div>

<script>
/* ============================================================
   Supabase client
   ============================================================ */
const supabaseClient = window.SUPABASE_CONFIG
  ? supabase.createClient(window.SUPABASE_CONFIG.url, window.SUPABASE_CONFIG.anonKey)
  : null;

const PAGE_SIZE = 15;

let currentView = "dashboard";
let currentType = null;     // grow | partnership | general
let currentPage = 0;
let searchTerm = "";
let statusValue = "all";
let searchDebounce = null;
let activeInquiryId = null;
let allInquiries = [];      // cache for current list view page

/* ============================================================
   Auth
   ============================================================ */
function el(tag, cls, html){
  const e = document.createElement(tag);
  if(cls) e.className = cls;
  if(html !== undefined) e.innerHTML = html;
  return e;
}
function esc(s){
  if(s === null || s === undefined) return "";
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function fmtDate(iso){
  const d = new Date(iso);
  return d.toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"});
}

document.getElementById("loginForm").addEventListener("submit", async (e)=>{
  e.preventDefault();
  const btn = document.getElementById("loginBtn");
  const errEl = document.getElementById("loginErr");
  errEl.style.display = "none";
  if(!supabaseClient){
    errEl.textContent = "Supabase is not configured. Fill in ../supabase-config.js first.";
    errEl.style.display = "block";
    return;
  }
  btn.disabled = true; btn.textContent = "Signing in…";
  const email = document.getElementById("loginEmail").value.trim();
  const password = document.getElementById("loginPassword").value;
  const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
  btn.disabled = false; btn.textContent = "Sign In";
  if(error){
    errEl.textContent = error.message;
    errEl.style.display = "block";
  }
});

document.getElementById("logoutBtn").addEventListener("click", async ()=>{
  if(supabaseClient) await supabaseClient.auth.signOut();
});

async function checkSession(){
  if(!supabaseClient) return;
  const { data } = await supabaseClient.auth.getSession();
  if(data.session){
    showApp(data.session.user);
  }else{
    showLogin();
  }
}

supabaseClient?.auth.onAuthStateChange((_event, session)=>{
  if(session) showApp(session.user); else showLogin();
});

function showLogin(){
  document.getElementById("loginScreen").style.display = "flex";
  document.getElementById("app").style.display = "none";
}
function showApp(user){
  document.getElementById("loginScreen").style.display = "none";
  document.getElementById("app").style.display = "block";
  document.getElementById("userEmail").textContent = user.email;
  refreshCounts();
  renderView();
}

/* ============================================================
   Nav
   ============================================================ */
document.querySelectorAll(".nav-item").forEach(item=>{
  item.addEventListener("click", ()=>{
    document.querySelectorAll(".nav-item").forEach(n=>n.classList.remove("active"));
    item.classList.add("active");
    const view = item.dataset.view;
    if(view === "dashboard"){
      currentView = "dashboard"; currentType = null;
      document.getElementById("view-dashboard").style.display = "block";
      document.getElementById("view-list").style.display = "none";
      loadDashboard();
    }else{
      currentView = "list"; currentType = view; currentPage = 0; searchTerm = ""; statusValue = "all";
      document.getElementById("searchInput").value = "";
      document.getElementById("statusFilter").value = "all";
      document.getElementById("view-dashboard").style.display = "none";
      document.getElementById("view-list").style.display = "block";
      const titles = { grow: "Grow With Us", partnership: "Partnerships", general: "General" };
      document.getElementById("listTitle").textContent = titles[view];
      loadList();
    }
  });
});

function renderView(){
  if(currentView === "dashboard") loadDashboard();
  else loadList();
}

/* ============================================================
   Counts (sidebar + stat cards)
   ============================================================ */
async function refreshCounts(){
  if(!supabaseClient) return;
  const types = ["grow","partnership","general"];
  const counts = {};
  for(const t of types){
    const { count } = await supabaseClient.from("inquiries").select("id", { count: "exact", head: true }).eq("inquiry_type", t);
    counts[t] = count || 0;
    document.getElementById("count-" + t).textContent = counts[t];
  }
  return counts;
}

/* ============================================================
   Dashboard home
   ============================================================ */
async function loadDashboard(){
  const cardsWrap = document.getElementById("statCards");
  cardsWrap.innerHTML = "";
  const tableWrap = document.getElementById("latestTableWrap");
  tableWrap.innerHTML = '<div class="loading-state"><div class="spinner"></div>Loading…</div>';

  const counts = await refreshCounts();
  const total = (counts.grow || 0) + (counts.partnership || 0) + (counts.general || 0);

  const todayStart = new Date(); todayStart.setHours(0,0,0,0);
  const { count: newToday } = await supabaseClient
    .from("inquiries")
    .select("id", { count: "exact", head: true })
    .gte("created_at", todayStart.toISOString());

  const stats = [
    { label: "Total Responses", num: total },
    { label: "Grow With Us", num: counts.grow || 0 },
    { label: "Partnerships", num: counts.partnership || 0 },
    { label: "General", num: counts.general || 0 },
    { label: "New Today", num: newToday || 0 }
  ];
  stats.forEach(s=>{
    const card = el("div", "stat-card");
    card.innerHTML = `<div class="num">${s.num}</div><div class="label">${s.label}</div>`;
    cardsWrap.appendChild(card);
  });

  const { data, error } = await supabaseClient
    .from("inquiries")
    .select("*")
    .order("created_at", { ascending: false })
    .limit(8);

  if(error){
    tableWrap.innerHTML = `<div class="empty-state">Couldn't load submissions: ${esc(error.message)}</div>`;
    return;
  }
  renderTable(tableWrap, data, false);
}

/* ============================================================
   Category list view
   ============================================================ */
document.getElementById("searchInput").addEventListener("input", (e)=>{
  clearTimeout(searchDebounce);
  searchDebounce = setTimeout(()=>{
    searchTerm = e.target.value.trim();
    currentPage = 0;
    loadList();
  }, 300);
});
document.getElementById("statusFilter").addEventListener("change", (e)=>{
  statusValue = e.target.value;
  currentPage = 0;
  loadList();
});

async function loadList(){
  const wrap = document.getElementById("listTableWrap");
  wrap.innerHTML = '<div class="loading-state"><div class="spinner"></div>Loading…</div>';

  let query = supabaseClient.from("inquiries").select("*", { count: "exact" }).eq("inquiry_type", currentType);
  if(statusValue !== "all") query = query.eq("status", statusValue);
  if(searchTerm){
    const s = searchTerm.replace(/[%_]/g, "");
    query = query.or(`full_name.ilike.%${s}%,email.ilike.%${s}%,company_name.ilike.%${s}%`);
  }
  query = query.order("created_at", { ascending: false }).range(currentPage * PAGE_SIZE, currentPage * PAGE_SIZE + PAGE_SIZE - 1);

  const { data, error, count } = await query;
  if(error){
    wrap.innerHTML = `<div class="empty-state">Couldn't load submissions: ${esc(error.message)}</div>`;
    return;
  }
  allInquiries = data;
  renderTable(wrap, data, true, count);
}

/* ============================================================
   Table rendering (shared by dashboard + list views)
   ============================================================ */
function renderTable(wrap, rows, withPagination, totalCount){
  wrap.innerHTML = "";
  const head = el("div", "row head");
  head.innerHTML = `<div>Name</div><div class="hide-mobile">Company</div><div class="hide-mobile">Email</div><div class="hide-mobile">Date</div><div>Status</div><div></div>`;
  wrap.appendChild(head);

  if(!rows || rows.length === 0){
    wrap.appendChild(el("div", "empty-state", "No submissions yet."));
    return;
  }

  rows.forEach(r=>{
    const row = el("div", "row clickable");
    const name = r.inquiry_type === "general" ? r.full_name : r.full_name;
    const company = r.company_name || "—";
    row.innerHTML = `
      <div>
        <div class="cell-name">${esc(name)}</div>
        <div class="cell-sub" style="display:none" data-mobile-company>${esc(company)} · ${esc(r.email)}</div>
      </div>
      <div class="hide-mobile">${esc(company)}</div>
      <div class="hide-mobile">${esc(r.email)}</div>
      <div class="hide-mobile">${fmtDate(r.created_at)}</div>
      <div><span class="badge ${esc(r.status)}">${esc(r.status)}</span></div>
      <div class="view-link">View →</div>
    `;
    row.addEventListener("click", ()=>openDrawer(r));
    wrap.appendChild(row);
  });

  if(withPagination){
    const totalPages = Math.max(1, Math.ceil((totalCount || rows.length) / PAGE_SIZE));
    const pag = el("div", "pagination");
    pag.innerHTML = `<span>Page ${currentPage + 1} of ${totalPages} · ${totalCount || rows.length} total</span>`;
    const btns = el("div", "btns");
    const prevBtn = el("button", "page-btn", "← Prev");
    prevBtn.disabled = currentPage === 0;
    prevBtn.addEventListener("click", ()=>{ currentPage--; loadList(); });
    const nextBtn = el("button", "page-btn", "Next →");
    nextBtn.disabled = currentPage >= totalPages - 1;
    nextBtn.addEventListener("click", ()=>{ currentPage++; loadList(); });
    btns.appendChild(prevBtn); btns.appendChild(nextBtn);
    pag.appendChild(btns);
    wrap.appendChild(pag);
  }
}

/* ============================================================
   Detail drawer
   ============================================================ */
const FIELD_LABELS = {
  grow: [
    ["full_name","Full Name"],["company_name","Company"],["email","Email"],["phone","Phone"],
    ["website_url","Website"],["linkedin_url","LinkedIn"],["industry","Industry"],
    ["company_size","Company Size"],["monthly_revenue","Monthly Revenue"],["services","Selected Services"],
    ["business_description","Business Description"],["project_description","Project Goals"],
    ["timeline","Timeline"],["budget","Budget"],["how_heard","How They Heard"],["created_at","Submitted"]
  ],
  partnership: [
    ["full_name","Full Name"],["company_name","Company"],["email","Email"],["phone","Phone"],
    ["website_url","Website"],["linkedin_url","LinkedIn"],["partner_why","Why Partner"],
    ["company_size","Company Size"],["monthly_revenue","Revenue"],["created_at","Submitted"]
  ],
  general: [
    ["full_name","Name"],["email","Email"],["general_question","Question"],["created_at","Submitted"]
  ]
};

function openDrawer(row){
  activeInquiryId = row.id;
  const titles = { grow: "Grow With Us", partnership: "Partnership", general: "General" };
  document.getElementById("drawerTitle").textContent = titles[row.inquiry_type] + " Inquiry";
  document.getElementById("statusSelect").value = row.status;

  const body = document.getElementById("drawerBody");
  body.innerHTML = "";
  const fields = FIELD_LABELS[row.inquiry_type] || FIELD_LABELS.general;
  fields.forEach(([key, label])=>{
    let val = row[key];
    if(key === "created_at") val = val ? new Date(val).toLocaleString("en-GB") : null;
    const f = el("div", "dfield");
    const valHtml = val ? esc(val) : '<span class="empty">Not provided</span>';
    f.innerHTML = `<div class="dlabel">${esc(label)}</div><div class="dval ${val ? "" : "empty"}">${val ? esc(val) : "Not provided"}</div>`;
    body.appendChild(f);
  });

  document.getElementById("overlay").classList.add("open");
  document.getElementById("drawer").classList.add("open");

  // Mark as Read automatically on open, if currently New
  if(row.status === "New"){
    updateStatus(row.id, "Read", true);
  }
}

function closeDrawer(){
  document.getElementById("overlay").classList.remove("open");
  document.getElementById("drawer").classList.remove("open");
  activeInquiryId = null;
}
document.getElementById("drawerClose").addEventListener("click", closeDrawer);
document.getElementById("overlay").addEventListener("click", closeDrawer);

document.getElementById("statusSelect").addEventListener("change", (e)=>{
  if(activeInquiryId) updateStatus(activeInquiryId, e.target.value, false);
});

async function updateStatus(id, status, silent){
  const { error } = await supabaseClient.from("inquiries").update({ status }).eq("id", id);
  if(error){ console.error(error); return; }
  if(!silent) document.getElementById("statusSelect").value = status;
  refreshCounts();
  if(currentView === "dashboard") loadDashboard(); else loadList();
}

document.getElementById("deleteBtn").addEventListener("click", async ()=>{
  if(!activeInquiryId) return;
  if(!confirm("Delete this submission permanently? This cannot be undone.")) return;
  const { error } = await supabaseClient.from("inquiries").delete().eq("id", activeInquiryId);
  if(error){ alert("Couldn't delete: " + error.message); return; }
  closeDrawer();
  refreshCounts();
  if(currentView === "dashboard") loadDashboard(); else loadList();
});

/* ============================================================
   Init
   ============================================================ */
checkSession();
</script>
